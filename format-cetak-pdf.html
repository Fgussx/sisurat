<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="title">Cetak Surat</title>
<style>
@page { size:A4 portrait; margin:0; }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:#eee; }
body { font-family:"Times New Roman", Times, serif; color:#111; }
.sheet {
  width:210mm;
  height:297mm;
  margin:10mm auto;
  background:#fff;
  position:relative;
  overflow:hidden;
}
.logo {
  position:absolute; left:11.5mm; top:7.0mm;
  width:61.5mm; height:auto;
}
.company {
  position:absolute; top:12.0mm; right:10.0mm;
  width:140mm; text-align:right;
  font-family:Arial,Helvetica,sans-serif;
}
.company .name {
  font-size:15px; font-weight:700; letter-spacing:.2px;
}
.company .line {
  font-size:11.2px; line-height:1.42; font-weight:400;
}
.meta {
  position:absolute; left:24.2mm; top:43.4mm;
  font-size:15px; line-height:1.45;
}
.meta .row { display:flex; }
.meta .label { width:19mm; }
.meta .colon { width:4mm; }
.meta .value { font-weight:400; }
.meta .subject { font-weight:700; text-decoration:underline; }
.date {
  position:absolute; top:43.0mm; right:19.5mm;
  font-size:15px;
}
.address {
  position:absolute; left:24.2mm; top:62.0mm;
  font-size:15px; line-height:1.42;
}
.salute {
  position:absolute; left:24.2mm; top:82.4mm;
  font-size:15px;
}
.content {
  position:absolute; left:24.2mm; right:18.8mm; top:90.6mm;
  font-size:14.65px; line-height:1.18;
  text-align:justify;
}
.content p { margin:0 0 3.8mm 0; }
.intro { text-indent:0; }
ol {
  margin:0 0 4.0mm 7.5mm;
  padding-left:5.5mm;
}
li {
  padding-left:1.2mm;
  margin:0 0 1.2mm 0;
}
li::marker { font-weight:700; }
.item-title { font-weight:700; }
.item-body { display:block; }
.closing {
  margin-top:2.0mm;
}
.signature {
  position:absolute;
  right:20.0mm; bottom:10.2mm;
  width:72mm;
  text-align:center;
  font-size:15px;
}
.signature .greeting { line-height:1.2; margin-bottom:0; }
.signature img {
  display:block;
  width:72mm;
  height:34mm;
  object-fit:contain;
  object-position:center;
  margin:-1mm auto -1mm;
}
.signature .person {
  font-weight:700;
  line-height:1.15;
}
.signature .role { line-height:1.15; }

@media print {
  html,body { width:210mm; height:297mm; background:#fff; }
  .sheet { margin:0; box-shadow:none; }
}
@media screen {
  .sheet { box-shadow:0 0 8px rgba(0,0,0,.18); }
}
</style>
</head>
<body>
<section class="sheet">

  <img class="logo" src="/src/assets/logo-sandya.png" alt="logo">
  <div class="company">
    <div class="name">SANDYA NETWORKS KANTOR LAYANAN PACITAN</div>
    <div class="line">Jl. Jend. Sudirman No. 3, Bowongan, Arjowinangun, Kecmatan Pacitan</div>
    <div class="line">+62 811-8882-2525 | info@sandya.net | www.sandya.net</div>
  </div>

  <div class="meta">
    <div class="row"><span class="label">Nomor</span><span class="colon">:</span><span class="value" id="nomor_surat">-</span></div>
    <div class="row"><span class="label">Perihal</span><span class="colon">:</span><span class="value subject" id="perihal">-</span></div>
  </div>

  <div class="date" id="tanggal">Pacitan, -</div>

  <div class="address" id="alamat_tujuan">
    Yth. -
  </div>

  <div class="salute">Dengan hormat,</div>

  <div class="content" id="content">
    <p class="intro" id="isi_surat">-</p>
  </div>

  <div class="signature">
    <div class="greeting">Hormat kami,<br>Sandya Networks</div>
        <img class="tanda-tangan-image" src="/src/assets/ttd.png" alt="tanda tangan">
        <div class="person">Ferry Dwi Leksono</div>
    <div class="role">Kepala Kantor Layanan Pacitan</div>
  </div>

</section>

<script>
  function loadSuratData() {
    const params = new URLSearchParams(window.location.search);
    const nomor = params.get('nomor_surat');
    const perihal = params.get('perihal');
    const isiSurat = params.get('isi_surat');
    const tanggalKirim = params.get('tanggal_kirim');
    const tujuan = params.get('tujuan');
    const fileFinalTtd = params.get('file_final_ttd');

    if (nomor) document.getElementById('nomor_surat').textContent = nomor;
    if (perihal) {
      document.getElementById('perihal').textContent = perihal;
      document.title = perihal;
    }
    
    if (isiSurat) {
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = '';
      
      // Parse isi_surat - bisa berisi HTML atau text biasa
      try {
        const parsedContent = JSON.parse(decodeURIComponent(isiSurat));
        if (typeof parsedContent === 'object' && parsedContent.html) {
          // Jika ada format khusus dengan HTML
          contentDiv.innerHTML = parsedContent.html;
        } else {
          // Jika hanya text biasa
          const p = document.createElement('p');
          p.className = 'intro';
          p.textContent = isiSurat;
          contentDiv.appendChild(p);
        }
      } catch (e) {
        // Jika bukan JSON, treat sebagai plain text
        const p = document.createElement('p');
        p.className = 'intro';
        p.textContent = isiSurat;
        contentDiv.appendChild(p);
      }
    }
    
    if (tanggalKirim) {
      const date = new Date(tanggalKirim);
      const options = { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Jakarta' };
      const formattedDate = date.toLocaleDateString('id-ID', options);
      document.getElementById('tanggal').textContent = `Pacitan, ${formattedDate}`;
    }
    
    if (tujuan) {
      document.getElementById('alamat_tujuan').innerHTML = `Yth. ${tujuan}`;
    }

    setTimeout(() => {
      // TTD hanya tampil jika sudah disetujui (file_final_ttd ada & bukan object kosong)
      const signatureEl = document.querySelector('.signature');
      if (signatureEl) {
        const hasTtd = fileFinalTtd && fileFinalTtd !== '{}' && fileFinalTtd !== 'null' && fileFinalTtd !== '""'
        signatureEl.style.display = hasTtd ? 'block' : 'none';
        console.log("TTD check:", fileFinalTtd, "→ show:", hasTtd)
      }
      window.print();
    }, 500);
  }

  window.addEventListener('load', loadSuratData);
</script>
</body>
</html>
