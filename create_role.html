<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Admin Role</title>
  <style>
    body {
      font-family: Inter, sans-serif;
      background: #F5F5F5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #0F172A;
      margin-top: 0;
      font-size: 24px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      color: #334155;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-family: Inter, sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    button:hover {
      background: #1D4ED8;
    }
    button:disabled {
      background: #93C5FD;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #D1FAE5;
    }
    .message.error {
      background: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FECACA;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Buat Role Admin</h1>
    
    <div class="form-group">
      <label for="namaRole">Nama Role</label>
      <input 
        type="text" 
        id="namaRole" 
        value="Admin"
        placeholder="Masukkan nama role"
      >
    </div>
    
    <div class="form-group">
      <label for="keterangan">Keterangan</label>
      <textarea 
        id="keterangan"
        rows="3"
        placeholder="Masukkan keterangan role"
      >Administrator sistem dengan akses penuh</textarea>
    </div>
    
    <button onclick="createRole()">Buat Role Admin</button>
    
    <div id="message" class="message"></div>
  </div>

  <script>
    async function createRole() {
      const namaRole = document.getElementById('namaRole').value.trim()
      const keterangan = document.getElementById('keterangan').value.trim()
      const messageEl = document.getElementById('message')
      const button = document.querySelector('button')

      if (!namaRole) {
        showMessage('Nama role wajib diisi', 'error')
        return
      }

      button.disabled = true
      button.textContent = 'Membuat...'

      try {
        const response = await fetch('http://localhost:5000/api/roles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            nama_role: namaRole, 
            keterangan: keterangan || null
          })
        })

        const data = await response.json()

        if (response.ok) {
          showMessage(`✓ Role ${namaRole} berhasil dibuat!\nID: ${data.role._id}`, 'success')
          button.textContent = 'Buat Role Admin'
          button.disabled = false
        } else {
          showMessage(data.error || 'Gagal membuat role', 'error')
          button.textContent = 'Buat Role Admin'
          button.disabled = false
        }
      } catch (error) {
        showMessage('Koneksi server gagal: ' + error.message, 'error')
        button.textContent = 'Buat Role Admin'
        button.disabled = false
      }
    }

    function showMessage(text, type) {
      const messageEl = document.getElementById('message')
      messageEl.textContent = text
      messageEl.className = 'message ' + type
      messageEl.style.display = 'block'
    }

    // Try to get existing roles on page load
    window.addEventListener('load', async () => {
      try {
        const response = await fetch('http://localhost:5000/api/roles')
        const data = await response.json()
        if (data.roles && data.roles.length > 0) {
          const adminRole = data.roles.find(r => r.nama_role === 'Admin')
          if (adminRole) {
            showMessage(`Role Admin sudah ada!\nID: ${adminRole._id}`, 'success')
          }
        }
      } catch (error) {
        console.log('Could not fetch roles:', error.message)
      }
    })
  </script>
</body>
</html>
